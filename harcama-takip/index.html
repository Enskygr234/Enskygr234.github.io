<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Harcama Takip</title>
<style>
  :root { --bg:#f3f6fb; --card:#fff; --text:#16202e; --muted:#667085; --line:#e4e7ec; --green:#12b76a; --red:#f04438; --accent:#2e90fa; }
  @media (prefers-color-scheme: dark) { :root { --bg:#0e131b; --card:#18202c; --text:#e6e9ef; --muted:#98a2b3; --line:#2a3443; } }
  * { box-sizing:border-box; }
  body { margin:0; font-family:system-ui,sans-serif; background:var(--bg); color:var(--text); padding:32px 16px; }
  main { max-width:640px; margin:0 auto; }
  h1 { margin:0 0 16px; }
  .cards { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; }
  .card { background:var(--card); border-radius:12px; padding:14px; }
  .card small { color:var(--muted); }
  .card div { font-size:1.3rem; font-weight:700; margin-top:4px; font-variant-numeric:tabular-nums; }
  .inc { color:var(--green); } .exp { color:var(--red); }
  form { background:var(--card); border-radius:12px; padding:14px; margin:14px 0; display:grid; grid-template-columns:2fr 1fr 1fr auto; gap:8px; }
  input, select { padding:9px 10px; border:1px solid var(--line); border-radius:8px; background:transparent; color:inherit; font-size:.95rem; min-width:0; }
  select option { color:#000; }
  button { padding:9px 14px; border:0; border-radius:8px; background:var(--accent); color:#fff; cursor:pointer; }
  .panel { background:var(--card); border-radius:12px; padding:14px; margin-bottom:14px; }
  .bar { display:flex; align-items:center; gap:8px; margin:6px 0; font-size:.9rem; }
  .bar span:first-child { width:90px; color:var(--muted); }
  .bar .track { flex:1; height:10px; background:var(--line); border-radius:5px; overflow:hidden; }
  .bar .fill { height:100%; background:var(--red); }
  table { width:100%; border-collapse:collapse; }
  td { padding:8px 4px; border-bottom:1px solid var(--line); font-size:.95rem; }
  td.amt { text-align:right; font-variant-numeric:tabular-nums; white-space:nowrap; }
  td .x { background:transparent; color:var(--muted); padding:2px 6px; }
  .empty { color:var(--muted); text-align:center; padding:16px; }
  @media (max-width:560px) { form { grid-template-columns:1fr 1fr; } .cards div { font-size:1.05rem; } }
</style>
</head>
<body>
<main>
  <h1>💰 Harcama Takip</h1>
  <div class="cards">
    <div class="card"><small>Bakiye</small><div id="bal">₺0</div></div>
    <div class="card"><small>Gelir</small><div id="inc" class="inc">₺0</div></div>
    <div class="card"><small>Gider</small><div id="exp" class="exp">₺0</div></div>
  </div>
  <form id="form">
    <input id="desc" placeholder="Açıklama" required>
    <input id="amount" type="number" step="0.01" min="0.01" placeholder="Tutar" required>
    <select id="cat">
      <option value="gelir">Gelir</option>
      <option value="market" selected>Market</option>
      <option value="fatura">Fatura</option>
      <option value="ulaşım">Ulaşım</option>
      <option value="eğlence">Eğlence</option>
      <option value="sağlık">Sağlık</option>
      <option value="diğer">Diğer</option>
    </select>
    <button>Ekle</button>
  </form>
  <div class="panel">
    <strong>Kategoriye göre giderler</strong>
    <div id="bars"></div>
  </div>
  <div class="panel">
    <strong>İşlemler</strong>
    <table><tbody id="rows"></tbody></table>
  </div>
</main>
<script>
  const KEY = 'harcamalar';
  const money = n => '₺' + n.toLocaleString('tr-TR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  let items;
  try { items = JSON.parse(localStorage.getItem(KEY)) || []; } catch { items = []; }
  const save = () => { try { localStorage.setItem(KEY, JSON.stringify(items)); } catch {} };

  function render() {
    const inc = items.filter(i => i.cat === 'gelir').reduce((s, i) => s + i.amount, 0);
    const exp = items.filter(i => i.cat !== 'gelir').reduce((s, i) => s + i.amount, 0);
    document.getElementById('bal').textContent = money(inc - exp);
    document.getElementById('inc').textContent = money(inc);
    document.getElementById('exp').textContent = money(exp);

    const byCat = {};
    items.filter(i => i.cat !== 'gelir').forEach(i => byCat[i.cat] = (byCat[i.cat] || 0) + i.amount);
    const max = Math.max(0, ...Object.values(byCat));
    const bars = document.getElementById('bars');
    bars.innerHTML = '';
    Object.entries(byCat).sort((a, b) => b[1] - a[1]).forEach(([cat, sum]) => {
      const row = document.createElement('div');
      row.className = 'bar';
      row.innerHTML = `<span></span><div class="track"><div class="fill" style="width:${(sum / max) * 100}%"></div></div><span></span>`;
      row.children[0].textContent = cat;
      row.children[2].textContent = money(sum);
      bars.append(row);
    });
    if (!Object.keys(byCat).length) bars.innerHTML = '<div class="empty">Henüz gider yok</div>';

    const rows = document.getElementById('rows');
    rows.innerHTML = '';
    [...items].reverse().forEach(i => {
      const tr = document.createElement('tr');
      const isInc = i.cat === 'gelir';
      tr.innerHTML = `<td></td><td style="color:var(--muted)"></td><td class="amt ${isInc ? 'inc' : 'exp'}"></td><td><button class="x" title="Sil">✕</button></td>`;
      tr.children[0].textContent = i.desc;
      tr.children[1].textContent = `${i.cat} · ${new Date(i.date).toLocaleDateString('tr-TR')}`;
      tr.children[2].textContent = (isInc ? '+' : '−') + money(i.amount);
      tr.querySelector('.x').onclick = () => { items = items.filter(x => x.id !== i.id); save(); render(); };
      rows.append(tr);
    });
    if (!items.length) rows.innerHTML = '<tr><td class="empty">Henüz işlem yok</td></tr>';
  }

  document.getElementById('form').onsubmit = e => {
    e.preventDefault();
    const amount = parseFloat(document.getElementById('amount').value);
    if (!(amount > 0)) return;
    items.push({
      id: Date.now(),
      desc: document.getElementById('desc').value.trim(),
      amount,
      cat: document.getElementById('cat').value,
      date: Date.now(),
    });
    save();
    e.target.reset();
    document.getElementById('cat').value = 'market';
    render();
  };

  render();
</script>
</body>
</html>
