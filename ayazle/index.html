<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ayazle — Türkçe kelime oyunu</title>
<meta name="description" content="999 seviyeli Türkçe kelime oyunu. Gizli kelimeyi bul, seviye atla, her bölümde zorlaşsın.">
<meta name="theme-color" content="#0b1626">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<canvas id="kar" aria-hidden="true"></canvas>

<div class="uygulama">
  <header>
    <button class="simge" id="yardimDugme" aria-label="Nasıl oynanır">?</button>
    <h1>AYAZ<span>LE</span></h1>
    <div class="sag-simgeler">
      <button class="simge" id="istatistikDugme" aria-label="İstatistikler">
        <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path fill="currentColor" d="M4 20V10h3v10H4zm6.5 0V4h3v16h-3zM17 20v-7h3v7h-3z"/></svg>
      </button>
      <button class="simge" id="ayarDugme" aria-label="Ayarlar">
        <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path fill="currentColor" d="M19.4 13a7.5 7.5 0 0 0 0-2l2.1-1.6-2-3.5-2.5 1a7.6 7.6 0 0 0-1.7-1L15 3h-4l-.4 2.9a7.6 7.6 0 0 0-1.7 1l-2.5-1-2 3.5L6.6 11a7.5 7.5 0 0 0 0 2l-2.1 1.6 2 3.5 2.5-1a7.6 7.6 0 0 0 1.7 1L11 21h4l.4-2.9a7.6 7.6 0 0 0 1.7-1l2.5 1 2-3.5L19.4 13zM13 15.5a3.5 3.5 0 1 1 0-7 3.5 3.5 0 0 1 0 7z" transform="translate(-1 0)"/></svg>
      </button>
    </div>
  </header>

  <nav class="secimler">
    <div class="sekmeler" role="tablist" aria-label="Oyun modu">
      <button role="tab" data-mod="seviye" aria-selected="true">Seviyeler</button>
      <button role="tab" data-mod="gunluk" aria-selected="false">Günlük</button>
      <button role="tab" data-mod="sureli" aria-selected="false">Süreli</button>
    </div>
    <div class="uzunluklar" id="uzunluklar" role="radiogroup" aria-label="Harf sayısı">
      <button role="radio" data-uzunluk="4" aria-checked="false">4</button>
      <button role="radio" data-uzunluk="5" aria-checked="true">5</button>
      <button role="radio" data-uzunluk="6" aria-checked="false">6</button>
    </div>
  </nav>

  <div class="seviye-bilgi" id="seviyeBilgi" hidden>
    <div class="seviye-ust">
      <button class="harita-dugme" id="haritaDugme" aria-label="Seviye haritası">
        <span class="harita-simge" aria-hidden="true">🗺️</span>
        <span><b id="seviyeNo">Seviye 1</b><small id="bolumAd">İlk Kar</small></span>
      </button>
      <span class="seviye-sure" id="seviyeSure" hidden>⏱ <b id="seviyeKalan">0:00</b></span>
      <span class="kar-para" id="karPara" title="Kar tanesi">❄ <b id="karSayi">0</b></span>
    </div>
    <div class="sure-cubuk" id="seviyeCubukKap" hidden><i id="seviyeCubuk"></i></div>
    <div class="ipuclari">
      <button class="ipucu" id="ipucuHarf">💡 Harf aç <small>30 ❄</small></button>
      <button class="ipucu" id="ipucuEle">🧹 3 harf ele <small>20 ❄</small></button>
    </div>
  </div>

  <div class="sureli-bilgi" id="sureliBilgi" hidden>
    <div class="sure-cubuk"><i id="sureCubuk"></i></div>
    <div class="sureli-satir"><span id="kalanSure">2:00</span><button class="pas" id="pasDugme" title="Bu kelimeyi geç (10 saniye ceza)">Pas · −10 sn</button><span>Bulunan: <b id="sureliPuan">0</b></span></div>
  </div>

  <main id="tahta" aria-label="Tahmin tahtası"></main>

  <div class="klavye" id="klavye" aria-label="Klavye"></div>
</div>

<div class="bildirim" id="bildirim" role="status" aria-live="polite"></div>

<!-- Pencereler -->
<div class="perde" id="perde" hidden>
  <section class="pencere" id="pencere" role="dialog" aria-modal="true">
    <button class="kapat" id="kapat" aria-label="Kapat">×</button>
    <div id="pencereIcerik"></div>
  </section>
</div>

<script src="sozluk.js"></script>
<script src="kelimeler.js"></script>
<script src="app.js"></script>
</body>
</html>
