<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Winter Gym · Antrenman programın</title>
<meta name="description" content="Boyunu, kilonu ve hedefini gir; kaç set, kaç tekrar, kaç kilo yapacağını söylesin. Antrenmanını takip et, ağırlıkların kendiliğinden artsın.">
<meta name="theme-color" content="#0e1216">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<canvas id="kar" aria-hidden="true"></canvas>

<!-- Kurulum sihirbazı -->
<section id="kurulum" class="ekran" hidden aria-label="Profil oluştur">
  <div class="kur-ust">
    <button class="geri-btn" id="kurGeri" aria-label="Geri" hidden><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
    <div class="kur-cubuk"><i id="kurIlerleme"></i></div>
    <span class="kur-adim" id="kurAdim"></span>
  </div>
  <div class="kur-icerik" id="kurIcerik"></div>
  <div class="kur-alt"><button class="ana-btn" id="kurIleri">Devam</button></div>
</section>

<!-- Uygulama -->
<div id="uyg" hidden>
  <main id="sayfa"></main>
  <nav class="sekmeler" aria-label="Bölümler">
    <button data-s="bugun" class="on"><svg viewBox="0 0 24 24"><path d="M4 10h2v4H4zM18 10h2v4h-2zM6 8h3v8H6zM15 8h3v8h-3zM9 11h6v2H9z"/></svg><span>Bugün</span></button>
    <button data-s="program"><svg viewBox="0 0 24 24"><path d="M5 4h14v16H5zM8 8h8M8 12h8M8 16h5"/></svg><span>Program</span></button>
    <button data-s="ilerleme"><svg viewBox="0 0 24 24"><path d="M4 19h16M6 15l4-5 3 3 5-7"/></svg><span>İlerleme</span></button>
    <button data-s="profil"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 20c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg><span>Profil</span></button>
  </nav>
</div>

<!-- Antrenman modu -->
<section id="antrenman" class="ekran" hidden aria-label="Antrenman"></section>

<!-- Dinlenme -->
<div id="dinlenme" hidden>
  <div class="din-ic">
    <div class="din-etiket">Dinlen</div>
    <svg class="halka" viewBox="0 0 120 120" aria-hidden="true"><circle cx="60" cy="60" r="52" class="iz"/><circle cx="60" cy="60" r="52" class="dolu" id="dinHalka"/></svg>
    <div class="din-sure" id="dinSure">1:30</div>
    <div class="din-sonraki" id="dinSonraki"></div>
    <div class="din-btn">
      <button id="dinEksi">−15 sn</button>
      <button id="dinAtla" class="ana-btn">Atla</button>
      <button id="dinArti">+15 sn</button>
    </div>
  </div>
</div>

<!-- Alt sayfa (sheet) -->
<div id="perde" hidden></div>
<div id="tabaka" hidden role="dialog" aria-modal="true"><div class="tutamac"></div><div id="tabakaIcerik"></div></div>

<div id="bildirim" role="status" aria-live="polite"></div>

<script src="program.js"></script>
<script src="app.js"></script>
</body>
</html>
