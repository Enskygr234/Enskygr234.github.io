<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Şifre Üretici</title>
<style>
  :root { --bg:#0f172a; --card:#1e293b; --text:#e2e8f0; --muted:#94a3b8; --accent:#22c55e; --line:#334155; }
  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; font-family:system-ui,sans-serif; background:var(--bg); color:var(--text); display:flex; align-items:center; justify-content:center; padding:16px; }
  main { width:100%; max-width:460px; background:var(--card); border-radius:16px; padding:24px; }
  h1 { margin:0 0 16px; font-size:1.5rem; }
  .out { display:flex; gap:8px; }
  #pw { flex:1; min-width:0; padding:14px; font:1.15rem ui-monospace,monospace; background:var(--bg); color:var(--text); border:1px solid var(--line); border-radius:10px; }
  button { border:0; border-radius:10px; cursor:pointer; font-size:1rem; }
  #copy { padding:0 16px; background:var(--line); color:var(--text); }
  .strength { height:6px; background:var(--line); border-radius:3px; margin:12px 0 4px; overflow:hidden; }
  .strength div { height:100%; width:0; transition:width .3s, background .3s; }
  #slabel { color:var(--muted); font-size:.9rem; }
  label { display:flex; align-items:center; gap:10px; margin:14px 0; cursor:pointer; }
  input[type=range] { flex:1; accent-color:var(--accent); }
  input[type=checkbox] { width:18px; height:18px; accent-color:var(--accent); }
  #gen { width:100%; padding:14px; background:var(--accent); color:#04210f; font-weight:700; margin-top:8px; }
</style>
</head>
<body>
<main>
  <h1>🔐 Şifre Üretici</h1>
  <div class="out">
    <input id="pw" readonly>
    <button id="copy">Kopyala</button>
  </div>
  <div class="strength"><div id="bar"></div></div>
  <span id="slabel"></span>

  <label>Uzunluk: <b id="lenv">16</b> <input id="len" type="range" min="6" max="64" value="16"></label>
  <label><input type="checkbox" id="upper" checked> Büyük harf (A-Z)</label>
  <label><input type="checkbox" id="lower" checked> Küçük harf (a-z)</label>
  <label><input type="checkbox" id="digits" checked> Rakam (0-9)</label>
  <label><input type="checkbox" id="symbols" checked> Sembol (!@#$...)</label>
  <label><input type="checkbox" id="similar"> Benzer karakterleri çıkar (O0Il1)</label>
  <button id="gen">Yeni Şifre Üret</button>
</main>
<script>
  const SETS = {
    upper: 'ABCDEFGHIJKLMNOPQRSTUVWXYZ',
    lower: 'abcdefghijklmnopqrstuvwxyz',
    digits: '0123456789',
    symbols: '!@#$%^&*()-_=+[]{};:,.<>?/',
  };
  const $ = id => document.getElementById(id);

  // crypto ile tarafsız rastgele indeks
  function randInt(n) {
    const max = Math.floor(2 ** 32 / n) * n;
    const buf = new Uint32Array(1);
    do crypto.getRandomValues(buf); while (buf[0] >= max);
    return buf[0] % n;
  }

  function generate() {
    const len = +$('len').value;
    const strip = s => $('similar').checked ? s.replace(/[O0Il1]/g, '') : s;
    const active = Object.keys(SETS).filter(k => $(k).checked).map(k => strip(SETS[k]));
    if (!active.length) { $('pw').value = ''; $('slabel').textContent = 'En az bir seçenek seçin'; $('bar').style.width = 0; return; }

    // her seçili kümeden en az bir karakter garanti et
    const chars = active.map(s => s[randInt(s.length)]);
    const all = active.join('');
    while (chars.length < len) chars.push(all[randInt(all.length)]);
    for (let i = chars.length - 1; i > 0; i--) {
      const j = randInt(i + 1);
      [chars[i], chars[j]] = [chars[j], chars[i]];
    }
    $('pw').value = chars.join('');

    const bits = len * Math.log2(all.length);
    const [label, color, pct] =
      bits < 40 ? ['Zayıf', '#ef4444', 25] :
      bits < 60 ? ['Orta', '#f59e0b', 50] :
      bits < 90 ? ['Güçlü', '#22c55e', 75] : ['Çok güçlü', '#10b981', 100];
    $('bar').style.width = pct + '%';
    $('bar').style.background = color;
    $('slabel').textContent = `${label} · ~${Math.round(bits)} bit entropi`;
  }

  $('len').oninput = () => { $('lenv').textContent = $('len').value; generate(); };
  ['upper', 'lower', 'digits', 'symbols', 'similar'].forEach(id => $(id).onchange = generate);
  $('gen').onclick = generate;
  $('copy').onclick = async () => {
    try {
      await navigator.clipboard.writeText($('pw').value);
      $('copy').textContent = 'Kopyalandı ✓';
    } catch {
      $('pw').select();
      $('copy').textContent = 'Seçildi';
    }
    setTimeout(() => $('copy').textContent = 'Kopyala', 1500);
  };
  generate();
</script>
</body>
</html>
